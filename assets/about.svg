<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="About Andrew: Flutter and backend developer building a POS app and BioVerse, a biology learning platform." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C151B"/>
      <stop offset="1" stop-color="#0A1217"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3E7C93" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3E7C93" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="status" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C5364"/>
      <stop offset="1" stop-color="#3E7C93"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="460" rx="14"/></clipPath>
  </defs>

  <style>
    .code { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace; font-size: 16px; fill: #D5E3E9; animation: rise 0.55s cubic-bezier(.2,.7,.2,1) both; }
    .ln { font-family: 'Cascadia Code', 'Fira Code', Consolas, Menlo, 'Courier New', monospace; font-size: 13px; fill: #3F5863; text-anchor: end; }
    .ui { font-family: 'Segoe UI', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; }
    .k { fill: #8EC9DE; }
    .t { fill: #FFD28A; }
    .s { fill: #9AD7A0; }
    .p { fill: #6E8792; }
    .f { fill: #B7A4FF; }
    .cur { fill: #9ED3E6; animation: blink 1.1s steps(1) infinite; }
    .hl { animation: fade 0.8s ease-out 2.8s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="460" fill="url(#win)"/>
    <ellipse cx="760" cy="90" rx="320" ry="200" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="900" height="44" fill="#0F1B22"/>
    <circle cx="28" cy="22" r="6" fill="#FF5F57" fill-opacity="0.85"/>
    <circle cx="50" cy="22" r="6" fill="#FEBC2E" fill-opacity="0.85"/>
    <circle cx="72" cy="22" r="6" fill="#28C840" fill-opacity="0.85"/>
    <rect x="104" y="8" width="150" height="36" rx="8" fill="#0A1217"/>
    <rect x="104" y="42" width="150" height="2" fill="#3E7C93"/>
    <circle cx="124" cy="26" r="4" fill="#5FC2E8"/>
    <text class="ui" x="136" y="30" fill="#CFE3EA">andrew.dart</text>
    <rect x="0" y="44" width="900" height="1" fill="#1C3441"/>

    <!-- gutter -->
    <rect x="0" y="45" width="56" height="389" fill="#0A1217" fill-opacity="0.6"/>

    <!-- active line highlight -->
    <rect class="hl" x="56" y="360" width="844" height="26" fill="#FFFFFF" fill-opacity="0.045"/>

    <!-- line numbers -->
    <text class="ln" x="40" y="92">1</text>
    <text class="ln" x="40" y="118">2</text>
    <text class="ln" x="40" y="144">3</text>
    <text class="ln" x="40" y="170">4</text>
    <text class="ln" x="40" y="196">5</text>
    <text class="ln" x="40" y="222">6</text>
    <text class="ln" x="40" y="248">7</text>
    <text class="ln" x="40" y="274">8</text>
    <text class="ln" x="40" y="300">9</text>
    <text class="ln" x="40" y="326">10</text>
    <text class="ln" x="40" y="352">11</text>
    <text class="ln" x="40" y="378" style="fill:#7FA3B2">12</text>
    <text class="ln" x="40" y="404">13</text>

    <!-- code -->
    <text class="code" x="72" y="92" style="animation-delay:0.15s"><tspan class="k">class</tspan> <tspan class="t">Andrew</tspan> <tspan class="k">extends</tspan> <tspan class="t">Developer</tspan> <tspan class="p">{</tspan></text>

    <text class="code" x="96" y="118" style="animation-delay:0.40s"><tspan class="k">final</tspan> role <tspan class="p">=</tspan> <tspan class="s">"Flutter &amp; Backend"</tspan><tspan class="p">;</tspan></text>

    <text class="code" x="96" y="144" style="animation-delay:0.65s"><tspan class="k">final</tspan> stack <tspan class="p">= [</tspan><tspan class="s">"Flutter"</tspan><tspan class="p">,</tspan> <tspan class="s">"FastAPI"</tspan><tspan class="p">,</tspan> <tspan class="s">"Firebase"</tspan><tspan class="p">];</tspan></text>

    <text class="code" x="96" y="196" style="animation-delay:0.95s"><tspan class="k">final</tspan> building <tspan class="p">= [</tspan></text>

    <text class="code" x="120" y="222" style="animation-delay:1.2s"><tspan class="s">"POS app with printer and scanner"</tspan><tspan class="p">,</tspan></text>

    <text class="code" x="120" y="248" style="animation-delay:1.45s"><tspan class="s">"BioVerse, an interactive biology platform"</tspan><tspan class="p">,</tspan></text>

    <text class="code" x="96" y="274" style="animation-delay:1.7s"><tspan class="p">];</tspan></text>

    <text class="code" x="96" y="326" style="animation-delay:1.95s"><tspan class="k">final</tspan> homeLab <tspan class="p">=</tspan> <tspan class="s">"my own server for deployments"</tspan><tspan class="p">;</tspan></text>

    <text class="code" x="96" y="378" style="animation-delay:2.3s"><tspan class="k">void</tspan> <tspan class="f">ship</tspan><tspan class="p">() =&gt;</tspan> <tspan class="f">debug</tspan><tspan class="p">().</tspan><tspan class="f">then</tspan><tspan class="p">(</tspan>learn<tspan class="p">);</tspan><tspan class="cur">|</tspan></text>

    <text class="code" x="72" y="404" style="animation-delay:2.55s"><tspan class="p">}</tspan></text>

    <!-- status bar -->
    <rect y="434" width="900" height="26" fill="url(#status)"/>
    <text class="ui" x="16" y="451" fill="#EAF6FA">master</text>
    <text class="ui" x="84" y="451" fill="#EAF6FA" fill-opacity="0.85">0 errors</text>
    <text class="ui" x="884" y="451" fill="#EAF6FA" fill-opacity="0.9" text-anchor="end">Dart   Flutter   UTF-8</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="459" rx="14" fill="none" stroke="#2C5364" stroke-opacity="0.7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
