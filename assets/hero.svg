<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Mobile. Backend. Production." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1318"/>
      <stop offset="1" stop-color="#0F2027"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3E7C93" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3E7C93" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ED3E6"/>
      <stop offset="1" stop-color="#3E7C93"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A7389"/>
      <stop offset="1" stop-color="#244F61"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#244F61"/>
      <stop offset="1" stop-color="#16303B"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9ED3E6"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#9ED3E6" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="320" rx="16"/></clipPath>
  </defs>

  <style>
    .line { font-family: 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; font-size: 46px; font-weight: 700; letter-spacing: -1px; fill: url(#txt); animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
    .l1 { animation-delay: 0.1s; }
    .l2 { animation-delay: 0.45s; }
    .l3 { animation-delay: 0.8s; }
    .bar { fill: #3E7C93; transform-box: fill-box; transform-origin: left center; animation: grow 0.9s ease-out 1.2s both; }
    .top { animation: lift 5s ease-in-out infinite; }
    .mid { animation: lift2 5s ease-in-out infinite; }
    .shadow { animation: pulse 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p { animation: drift 6s ease-in-out infinite; }
    .p2 { animation-delay: 2s; }
    .p3 { animation-delay: 4s; }
    @keyframes rise { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }
    @keyframes lift2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.35; } 50% { transform: scale(0.9); opacity: 0.2; } }
    @keyframes drift { 0% { transform: translateY(14px); opacity: 0; } 40% { opacity: 0.8; } 100% { transform: translateY(-26px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="320" fill="url(#bg)"/>
    <rect width="900" height="320" fill="url(#dots)"/>
    <ellipse cx="660" cy="165" rx="270" ry="160" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="319" rx="16" fill="none" stroke="#2C5364" stroke-opacity="0.6"/>

  <!-- tagline -->
  <text class="line l1" x="64" y="132">Mobile.</text>
  <text class="line l2" x="64" y="188">Backend.</text>
  <text class="line l3" x="64" y="244">Production.</text>
  <rect class="bar" x="66" y="266" width="64" height="3" rx="1.5"/>

  <!-- floor shadow -->
  <ellipse class="shadow" cx="660" cy="304" rx="120" ry="12" fill="#000000" fill-opacity="0.35"/>

  <!-- layer 3 (bottom) -->
  <g transform="translate(660 222)">
    <polygon points="-120,0 0,60 0,76 -120,16" fill="#142A35"/>
    <polygon points="0,60 120,0 120,16 0,76" fill="#0F2027"/>
    <polygon points="0,-60 120,0 0,60 -120,0" fill="url(#g3)"/>
    <polyline points="-120,0 0,60 120,0" fill="none" stroke="#9ED3E6" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- layer 2 (middle) -->
  <g class="mid">
    <g transform="translate(660 152)">
      <polygon points="-120,0 0,60 0,76 -120,16" fill="#1E3F4F"/>
      <polygon points="0,60 120,0 120,16 0,76" fill="#17323D"/>
      <polygon points="0,-60 120,0 0,60 -120,0" fill="url(#g2)"/>
      <polyline points="-120,0 0,60 120,0" fill="none" stroke="#9ED3E6" stroke-opacity="0.35" stroke-width="1"/>
    </g>
  </g>

  <!-- layer 1 (top) -->
  <g class="top">
    <g transform="translate(660 82)">
      <polygon points="-120,0 0,60 0,76 -120,16" fill="#2F6479"/>
      <polygon points="0,60 120,0 120,16 0,76" fill="#234E60"/>
      <polygon points="0,-60 120,0 0,60 -120,0" fill="url(#g1)"/>
      <polygon points="0,-34 68,0 0,34 -68,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="0,-12 24,0 0,12 -24,0" fill="#FFFFFF" fill-opacity="0.55"/>
      <polyline points="-120,0 0,60 120,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"/>
    </g>
  </g>

  <!-- floating particles -->
  <g transform="translate(540 150)"><g class="p"><polygon points="0,-5 5,0 0,5 -5,0" fill="#9ED3E6"/></g></g>
  <g transform="translate(790 120)"><g class="p p2"><polygon points="0,-4 4,0 0,4 -4,0" fill="#9ED3E6"/></g></g>
  <g transform="translate(770 250)"><g class="p p3"><polygon points="0,-5 5,0 0,5 -5,0" fill="#9ED3E6"/></g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
